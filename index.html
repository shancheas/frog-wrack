<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frog Whack!</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" type="image/png" href="assets/frog-head.png" />
  </head>
  <body>
    <button
      class="mute-toggle"
      id="muteBtn"
      onclick="toggleMute()"
      title="Mute"
    >
      🔊
    </button>
    <button class="config-toggle" onclick="toggleConfig()">⚙️ Settings</button>

    <div class="config-panel" id="configPanel">
      <div class="config-title">🐸 Game Settings</div>

      <div class="preset-section">
        <span class="preset-label">Difficulty Presets</span>
        <div class="preset-buttons">
          <button class="preset-btn" onclick="applyPreset(1)">1</button>
          <button class="preset-btn" onclick="applyPreset(2)">2</button>
          <button class="preset-btn active" onclick="applyPreset(3)">3</button>
          <button class="preset-btn" onclick="applyPreset(4)">4</button>
          <button class="preset-btn" onclick="applyPreset(5)">5</button>
        </div>
      </div>

      <div class="config-section">
        <div class="config-label">
          <span>Frog Show Time (Min)</span>
          <span class="config-value" id="showMinValue">1000ms</span>
        </div>
        <div class="slider-container">
          <span>500</span>
          <input
            type="range"
            id="showTimeMin"
            min="500"
            max="2000"
            value="1000"
            step="100"
            oninput="updateSlider('showMin')"
          />
          <span>2000</span>
        </div>
      </div>

      <div class="config-section">
        <div class="config-label">
          <span>Frog Show Time (Max)</span>
          <span class="config-value" id="showMaxValue">1000ms</span>
        </div>
        <div class="slider-container">
          <span>500</span>
          <input
            type="range"
            id="showTimeMax"
            min="500"
            max="2000"
            value="1000"
            step="100"
            oninput="updateSlider('showMax')"
          />
          <span>2000</span>
        </div>
      </div>

      <div class="config-section">
        <div class="config-label">
          <span>Spawn Interval (Min)</span>
          <span class="config-value" id="spawnMinValue">1000ms</span>
        </div>
        <div class="slider-container">
          <span>500</span>
          <input
            type="range"
            id="spawnIntervalMin"
            min="500"
            max="2000"
            value="1000"
            step="100"
            oninput="updateSlider('spawnMin')"
          />
          <span>2000</span>
        </div>
      </div>

      <div class="config-section">
        <div class="config-label">
          <span>Spawn Interval (Max)</span>
          <span class="config-value" id="spawnMaxValue">1000ms</span>
        </div>
        <div class="slider-container">
          <span>500</span>
          <input
            type="range"
            id="spawnIntervalMax"
            min="500"
            max="2000"
            value="1000"
            step="100"
            oninput="updateSlider('spawnMax')"
          />
          <span>2000</span>
        </div>
      </div>

      <div class="difficulty-indicator">
        <span class="difficulty-text" id="difficultyText"
          >Difficulty: Medium</span
        >
      </div>

      <button class="apply-btn" onclick="applySettings()">
        🎮 Apply & Restart
      </button>
    </div>

    <div class="game-wrapper">
      <h1>FROG WHACK!</h1>
      <div class="score-board">
        <div class="score-item">
          <span class="score-label">Score</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Time</span>
          <span class="score-value" id="timer">30</span>
        </div>
        <div class="score-item">
          <span class="score-label">Missed</span>
          <span class="score-value" id="missed">0</span>
        </div>
      </div>
      <canvas id="game-canvas"></canvas>
      <p class="instructions">Tap the frogs before they hide! 🐸</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/settings.js"></script>
  </body>
</html>
